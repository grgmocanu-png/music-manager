name: Diagnostic blocare Explore
on:
  push:
    branches: [ci-debug]
jobs:
  measure:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - run: git worktree add ../old 460ca0ad9223d0855aed193de268dde2748ef889
      - name: v0.9.7 (veche)
        shell: bash
        env: { QT_QPA_PLATFORM: offscreen }
        run: python .github/freeze/freeze.py ../old 3000 6 2>&1 | tail -15
      - name: v0.9.8 (nouă)
        shell: bash
        env: { QT_QPA_PLATFORM: offscreen }
        run: python .github/freeze/freeze.py . 3000 6 2>&1 | tail -15
