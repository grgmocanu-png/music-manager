name: Diagnostic blocare Explore
on:
  push:
    branches: [ci-debug]
jobs:
  measure:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - name: Piese de test
        run: python .github/freeze/gen.py "$env:RUNNER_TEMP\piese" 40
      - name: Versiunea veche (0.9.7) + diagnostic
        shell: bash
        run: |
          git worktree add ../old 460ca0a
          cp music_manager/diag.py ../old/music_manager/
          python - <<'PY'
          p = "../old/music_manager/app.py"; s = open(p, encoding="utf-8").read()
          s = s.replace('    if os.environ.get("MM_SMOKE_TEST"):', '    if os.environ.get("MM_DIAG_ANALYZE"):\n        from . import diag\n        return diag.run(app, win, os.environ["MM_DIAG_ANALYZE"], os.environ.get("MM_DIAG_OUT", "diag.json"))\n    if os.environ.get("MM_SMOKE_TEST"):')
          open(p, "w", encoding="utf-8").write(s)
          PY
      - name: Build exe vechi și nou
        shell: bash
        run: |
          (cd ../old && pyinstaller --noconfirm --clean --distpath ../dist_old packaging/MusicManager.spec > /dev/null 2>&1)
          pyinstaller --noconfirm --clean --distpath ../dist_new packaging/MusicManager.spec > /dev/null 2>&1
          ls ../dist_old/MusicManager/MusicManager.exe ../dist_new/MusicManager/MusicManager.exe
      - name: Rulează diagnosticul
        shell: pwsh
        env: { QT_QPA_PLATFORM: offscreen, MM_DIAG_PAD: "3000" }
        run: |
          $env:MM_DIAG_ANALYZE = "$env:RUNNER_TEMP\piese"
          foreach ($v in @("old", "new")) {
            Remove-Item -Recurse -Force "$env:APPDATA\Music Manager" -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force "$env:LOCALAPPDATA\Music Manager" -ErrorAction SilentlyContinue
            $env:MM_DIAG_OUT = "$env:RUNNER_TEMP\diag_$v.json"
            $p = Start-Process "..\dist_$v\MusicManager\MusicManager.exe" -PassThru
            if (-not $p.WaitForExit(330000)) { $p.Kill(); Write-Output "::warning::$v EXE NU S-A ÎNCHIS (blocat)" }
            python .github/freeze/show.py "EXE-$v" $env:MM_DIAG_OUT
          }
