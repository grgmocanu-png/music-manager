name: Diagnostic modele
on:
  push:
    branches: [ci-debug]
jobs:
  ml:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt onnxruntime
      - run: git clone -q --depth 1 https://github.com/librosa/data ../librosa_data
      - name: Verificare
        shell: bash
        env: { PYTHONUTF8: "1", PYTHONIOENCODING: "utf-8" }
        run: |
          python .github/ml/check.py ../librosa_data/audio 2>&1 | grep "::warning" || true
